<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>car dealership</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="block-1">
        <section class="section-1">
            <form id="form_1" class="form-pass">
                <h1>Регистрация</h1>
                <!-- <input type="login" placeholder="Логин" id="login">
                    <input type="password" placeholder="пароль" id="password"> -->


                <input type="marka" placeholder="marka" id="marka">
                <input type="model" placeholder="model" id="model">
                <input type="god" placeholder="god" id="god">
                <input type="price" placeholder="price" id="price">



                <button type="submit">Зарегистрироваться</button>
            </form>

            <form id="form_2" class="form-pass-2">
                <h1>Авторизация</h1>
                <input type="login" placeholder="Логин" id="login">
                <input type="password" placeholder="пароль" id="password">
                <button type="submit">Войти</button>
            </form>
        </section>

        <section class="section-2">
            <div class="all-cars">
                <div class="window-with-data">

                </div>
                <div class="buttons">
                    <div class="indicators">
                        <div class="k1"></div>
                        <div class="k2"></div>
                        <div class="k3"></div>
                    </div>
                    <button>Обновить</button>
                </div>
            </div>
        </section>

        <script src="./api.js"></script>
    </section>
</body>

</html>
