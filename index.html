<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>car dealership</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="block-1">
        <section class="section-1">
            <form id="form_1" class="form-pass">
                <h1>Регистрация</h1>
                <input type="marka" placeholder="marka" id="marka">
                <input type="model" placeholder="model" id="model">
                <input type="god" placeholder="god" id="god">
                <input type="price" placeholder="price" id="price">
                <button type="submit">Зарегистрироваться</button>
            </form>

            <form id="registerForm" class="form-pass-2">
                <h1>Регистрация</h1>
                <input type="email" placeholder="Логин" id="registerEmail">
                <input type="text" placeholder="Телефон (+7 999 123-45-67)" id="registerPhone">
                <span id="phoneError" style="color: red; display: none; font-size: 12px;"></span>
                <input type="password" placeholder="Пароль" id="registerPassword">
                <button type="submit">Зарегистрироваться</button>
            </form>

            <form id="loginForm" class="form-pass-2">\
                <h1>Авторизация</h1>
                <input type="email" placeholder="Логин" id="loginEmail">
                <input type="password" placeholder="Пароль" id="loginPassword">
                <button type="submit">Войти</button>
            </form>

        </section>

        <section class="section-2">
            <div class="all-cars">
                <div class="window-with-data">
                    <div class="slider">
                        <button class="slider_btn slider_btn--prev">Туда</button>
                        <div class="slider_track">
                            <div class="slide"><img src="./photo/photo_2026-10-26_12-53-46.jpg" alt=""></div>
                            <div class="slide"><img src="./photo/photo_2026-10-26_13-52-41.jpg" alt=""></div>
                            <div class="slide"><img src="./photo/photo_2026-10-26_13-52-52.jpg" alt=""></div>
                        </div>
                        <button class="slider_btn slider_btn--next">Сюда</button>
                    </div>
                </div>

                <div class="buttons">
                    <div class="indicators">
                        <div class="k1"></div>
                        <div class="k2"></div>
                        <div class="k3"></div>
                    </div>
                    <button>Обновить</button>
                </div>
            </div>
        </section>

        <script src="./slider.js"></script>
        <script src="./api.js"></script>
    </section>
</body>

</html>
